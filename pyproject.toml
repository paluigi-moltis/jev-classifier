[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "jev-classifier"
version = "0.1.0"
description = "Text classification GUI powered by TypeSafe Jev via Vercel AI Gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ai[vercel]>=0.7.0",
    "flet>=1.0.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
]
